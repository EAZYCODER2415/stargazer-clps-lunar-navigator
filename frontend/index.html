<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stargazer</title>
    <style>
      /* Loading screen. It is in the page itself so it shows before any script has arrived;
         LoadingScreen.jsx draws the same thing while a later part of the site is fetched. */
      .boot-screen { position:fixed; inset:0; z-index:9999; display:grid; grid-template-rows:1fr auto; justify-items:center; box-sizing:border-box; padding:24px; color:#e6e9f5; background:#05060a; font-family:'Bahnschrift','DIN Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif; }
      .boot-core { display:grid; align-self:center; justify-items:center; width:min(380px,82vw); }
      .boot-core img { display:block; width:72px; height:72px; margin-bottom:22px; }
      .boot-name { margin:0; padding-left:.34em; color:#f5f7ff; font-size:32px; font-weight:600; line-height:1; letter-spacing:.34em; text-transform:uppercase; }
      .boot-sub { margin:14px 0 30px; color:#949db3; font:500 11px/1.3 ui-monospace,'Cascadia Mono',SFMono-Regular,Menlo,Consolas,monospace; letter-spacing:.2em; text-align:center; text-transform:uppercase; }
      .boot-bar { width:100%; height:2px; overflow:hidden; background:rgba(148,163,184,.22); }
      .boot-bar i { display:block; width:38%; height:100%; background:#4cc9f0; box-shadow:0 0 10px #4cc9f0; animation:boot-slide 1.3s ease-in-out infinite; }
      .boot-status { display:flex; justify-content:space-between; width:100%; margin-top:10px; color:#6f7a92; font:10px/1 ui-monospace,'Cascadia Mono',SFMono-Regular,Menlo,Consolas,monospace; letter-spacing:.2em; text-transform:uppercase; }
      .boot-note { display:flex; align-items:center; gap:10px; margin:0 0 20px; padding:10px 18px; border:1px solid rgba(76,201,240,.5); border-radius:999px; color:#dff8ff; background:rgba(76,201,240,.09); box-shadow:0 0 22px rgba(76,201,240,.14); font:600 11px/1 ui-monospace,'Cascadia Mono',SFMono-Regular,Menlo,Consolas,monospace; letter-spacing:.18em; text-transform:uppercase; }
      .boot-note svg { flex:0 0 auto; width:18px; height:18px; fill:none; stroke:#4cc9f0; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
      #root > .boot-screen { transition:opacity .35s ease; }
      #root > .boot-screen.boot-leaving { opacity:0; }
      @keyframes boot-slide { from { transform:translateX(-110%); } to { transform:translateX(275%); } }
      @media (prefers-reduced-motion:reduce) { .boot-bar i { width:100%; animation:none; opacity:.5; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen" role="status" aria-label="Stargazer is loading">
        <div class="boot-core">
          <img src="/favicon.svg" alt="" />
          <p class="boot-name">Stargazer</p>
          <p class="boot-sub">CLPS Lunar Mission Navigator</p>
          <div class="boot-bar"><i></i></div>
          <div class="boot-status"><span>Preparing mission systems</span><span>Loading</span></div>
        </div>
        <p class="boot-note"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1.5" /><path d="M8 20h8M12 16v4" /></svg>Best experienced on a computer</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
